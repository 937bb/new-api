services:
  new-api:
    build: .
    image: 937bb/new-api:homepage-seo-refresh
    container_name: new-api
    restart: always
    network_mode: host
    command: --log-dir /app/logs
    env_file:
      - .env
    volumes:
      - ./data:/data
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/api/status | grep -o '\"success\":\\s*true' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
