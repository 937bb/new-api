    <meta charset="UTF-8" />

    <meta name="google" content="notranslate" />

    <!-- Primary Meta Tags -->
    <title>ModelPort Global</title>

      content="AI API gateway, model routing, model proxy, OpenAI API, Claude API, Gemini API, AI billing"
    />

    <link rel="canonical" href="https://modelportglobal.com/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://modelportglobal.com/" />
    <meta property="og:title" content="ModelPort Global" />
    <meta
      property="og:description"
      content="ModelPort Global provides a unified AI API gateway for resilient model routing, usage management, billing, and secure operations."

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />

    />
    <meta
      name="twitter:image"
      content="https://modelportglobal.com/logo.png"
    />

    <meta name="theme-color" content="#fff" />
    <!-- Resolve the theme before first paint so the page never flashes light
         and one-shot detectors (e.g. Dark Reader) see the real theme.
         Keep in sync with ThemeProvider and THEME_STORAGE_KEYS.mode. -->
    <script>
      ;(function () {
        var theme = 'system'
        try {
          theme = localStorage.getItem('newapi:theme:v1:mode') || 'system'
        } catch (e) {}
        if (theme !== 'dark' && theme !== 'light') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light'
        }
        document.documentElement.classList.add(theme)
      })()
    </script>
    <!--umami-->

  </head>

  </body>
